
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hello Kitty Calculator</title>

    <link rel="stylesheet" href="Style.css">
</head>
<body>

    <div class="calculadora">

        <header>
            <img src="Cute Hello Kitty Sticker - Cute Hello Kitty Hearts - Descobrir e Compartilhar GIFs.gif" class="decoracao">
            <h1>Hello Kitty</h1>
            <p>My Pink Calculator ♡</p>
        </header>

        <div class="visor">
            <div id="operacao"></div>
            <div id="resultado">0</div>
        </div>

        <div class="botoes">

            <button class="especial" onclick="limpar()">AC</button>
            <button class="especial" onclick="apagar()">⌫</button>
            <button class="especial" onclick="porcentagem()">%</button>
            <button class="operador" onclick="adicionar('/')">÷</button>

            <button onclick="adicionar('7')">7</button>
            <button onclick="adicionar('8')">8</button>
            <button onclick="adicionar('9')">9</button>
            <button class="operador" onclick="adicionar('*')">×</button>

            <button onclick="adicionar('4')">4</button>
            <button onclick="adicionar('5')">5</button>
            <button onclick="adicionar('6')">6</button>
            <button class="operador" onclick="adicionar('-')">−</button>

            <button onclick="adicionar('1')">1</button>
            <button onclick="adicionar('2')">2</button>
            <button onclick="adicionar('3')">3</button>
            <button class="operador" onclick="adicionar('+')">+</button>

            <button class="especial" onclick="adicionar('.')">.</button>
            <button onclick="adicionar('0')">0</button>
            <button class="igual" onclick="calcular()">=</button>

        </div>

        <footer>Made with love ♡</footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
